version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-downstream:
    image: ealen/echo-server:latest
    ports:
      - "8080:80"
    environment:
      - ENABLE_HOST=true
      - ENABLE_HTTP=true
